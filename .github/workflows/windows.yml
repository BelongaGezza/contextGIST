name: windows
# Windows 11 / MSVC build + tests. A separate workflow (not a job in ci.yml) so
# the path filter below keeps macOS-only changes from running it, and so the
# Windows lane never edits the macOS one (docs/PLATFORMS.md, rule 1). Anything
# under crates/ or the golden file runs both, which is the intended gate for
# shared-core changes.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/windows/**"
      - "tools/package-windows.ps1"
      - "tools/windows/**"
      - "apps/macos/Tests/golden.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/windows/**"
      - "tools/package-windows.ps1"
      - "tools/windows/**"
      - "apps/macos/Tests/golden.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  # Weekly, so a toolchain or advisory change that breaks the Windows lane
  # surfaces without needing a path-matching commit.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # Only supersede runs on pull requests; every push to main must finish so
  # each merge commit has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-rust-
      # windows-latest checks out with core.autocrlf=true; .gitattributes must
      # keep golden.json at LF or golden_file_matches_gist_rsvp fails.
      - run: cargo test --workspace --locked
      # The capture spike is its own workspace, so --workspace never builds it.
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/windows/spikes/capture-prober/Cargo.toml --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path apps/windows/spikes/capture-prober/Cargo.toml --locked --all-targets -- -D warnings
      # Packaging prototype: build the zip, then install and uninstall it with
      # overridden locations so the runner's real Start menu/registry are untouched.
      - name: Package + install/uninstall smoke test
        shell: pwsh
        run: |
          ./tools/package-windows.ps1
          $t = Join-Path $env:RUNNER_TEMP 'pkgtest'
          Expand-Archive dist/windows/contextGIST-0.0.0-prototype-x64.zip "$t/pkg"
          New-Item -ItemType Directory "$t/sm" | Out-Null
          $a = @{ InstallDir = "$t/inst"; StartMenuDir = "$t/sm"; UninstallKey = 'HKCU:\Software\contextGISTTest' }
          & "$t/pkg/install.ps1" @a
          foreach ($p in "$t/inst/bin/capture-prober.exe", "$t/sm/contextGIST.lnk", $a.UninstallKey) {
            if (-not (Test-Path $p)) { throw "missing after install: $p" }
          }
          Copy-Item "$t/inst/uninstall.ps1" "$t/u.ps1"
          & "$t/u.ps1" @a
          # The folder itself is removed by a detached cmd a moment after we exit.
          for ($i = 0; $i -lt 20 -and (Test-Path "$t/inst"); $i++) { Start-Sleep 1 }
          foreach ($p in "$t/inst", "$t/sm/contextGIST.lnk", $a.UninstallKey) {
            if (Test-Path $p) { throw "residue after uninstall: $p" }
          }
      # Installer hardening: upgrades drop stale files, and neither script will
      # touch a folder that is not a contextGIST install.
      - name: Installer safety checks
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'pkgtest2'
          Expand-Archive dist/windows/contextGIST-0.0.0-prototype-x64.zip "$t/pkg"
          New-Item -ItemType Directory "$t/sm", "$t/foreign" | Out-Null
          Set-Content "$t/foreign/keep.txt" x
          $a = @{ StartMenuDir = "$t/sm"; UninstallKey = 'HKCU:\Software\contextGISTTest2' }
          & "$t/pkg/install.ps1" -InstallDir "$t/inst" @a
          Set-Content "$t/inst/bin/stale.dll" x
          & "$t/pkg/install.ps1" -InstallDir "$t/inst" @a
          if (Test-Path "$t/inst/bin/stale.dll") { throw 'stale file survived an upgrade' }
          foreach ($case in @({ & "$t/pkg/install.ps1" -InstallDir "$t/foreign" @a },
                              { & "$t/pkg/uninstall.ps1" -InstallDir "$t/foreign" @a })) {
            $threw = $false; try { & $case } catch { $threw = $true }
            if (-not $threw) { throw 'script touched a non-contextGIST folder' }
          }
          if (-not (Test-Path "$t/foreign/keep.txt")) { throw 'foreign file was deleted' }
          # No -InstallDir: the folder comes from the registered InstallLocation.
          Copy-Item "$t/inst/uninstall.ps1" "$t/u.ps1"
          & "$t/u.ps1" @a
          for ($i = 0; $i -lt 20 -and (Test-Path "$t/inst"); $i++) { Start-Sleep 1 }
          foreach ($p in "$t/inst", $a.UninstallKey) { if (Test-Path $p) { throw "residue: $p" } }

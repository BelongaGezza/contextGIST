name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual run, e.g. to check the `upstream` job right after a GIST change.
  workflow_dispatch:
  schedule:
    # Weekly, so new RUSTSEC advisories surface without needing a commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only supersede runs on pull requests; every push to main must finish so
  # each merge commit has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust core: tests run against GIST's crates as pinned in Cargo.toml (a git
  # dependency on BelongaGezza/gist; cargo fetches it, no checkout needed).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-rust-
      - name: UPSTREAM_BASELINE matches the Cargo.toml pin
        run: |
          base=$(sed -n 's/^commit=//p' UPSTREAM_BASELINE)
          for crate in gist-model gist-parse-txt gist-rsvp; do
            rev=$(grep -E "^$crate " Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')
            if [ "$rev" != "$base" ]; then
              echo "::error::$crate rev $rev != UPSTREAM_BASELINE commit $base"
              exit 1
            fi
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Licence / advisory / source policy (deny.toml). Separate job so a new
  # advisory never hides test results (and vice versa).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # v2.1.1 bundles cargo-deny 0.20.2, the first version able to parse
      # RUSTSEC's CVSS 4.0 entries (same pin GIST's core-quality uses).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          arguments: --exclude-dev

  # Has GIST moved since UPSTREAM_BASELINE? Fails (and prints the full review
  # report) when watched GIST paths changed and haven't been reviewed with
  # tools/upstream-review.sh --record. Scheduled/manual only: a red check on
  # every push or PR because of an unrelated GIST commit would block work that
  # has nothing to do with it; the weekly run is the nudge instead.
  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The script's offline --check mode compares against this clone.
      - name: Clone GIST
        run: git clone --quiet https://github.com/BelongaGezza/gist.git .upstream/gist
      - name: Upstream review check
        run: |
          if ! tools/upstream-review.sh --check --strict; then
            tools/upstream-review.sh
            exit 1
          fi

  # The app itself: Debug build, no code signing (signing/notarization is
  # tools/release-sign.sh's job and needs secrets this workflow doesn't have).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-macos-
      # Not preinstalled on the runner; Homebrew won't install a bare formula
      # file, so use the project's pinned release archive (as GIST's CI does).
      - name: Install XcodeGen (pinned 2.46.0)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo /tmp/xcodegen/install.sh
      # uniffi no longer ships a standalone uniffi-bindgen on crates.io;
      # contextgist-ffi builds its own (see the comment in tools/gen-bindings.sh).
      - name: Install uniffi-bindgen
        run: |
          cargo install --locked --path crates/contextgist-ffi --bin uniffi-bindgen \
            --features uniffi-bindgen-bin --root "$HOME/.cargo-uniffi-bindgen"
          echo "$HOME/.cargo-uniffi-bindgen/bin" >> "$GITHUB_PATH"
      # Builds contextgist-ffi and generates apps/macos/Generated/*.swift.
      - run: ./tools/gen-bindings.sh
      - name: xcodegen generate
        working-directory: apps/macos
        run: xcodegen generate
      - name: xcodebuild build
        working-directory: apps/macos
        run: |
          xcodebuild build \
            -scheme contextGIST \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      # Swift PacingEngine/ORP parity vs. golden values from the Rust core.
      - name: xcodebuild test
        working-directory: apps/macos
        run: |
          xcodebuild test \
            -scheme contextGIST \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # Single required check for branch protection. Always runs, and fails if any
  # needed job failed or was cancelled; a job that was legitimately skipped
  # (the schedule-only `upstream`) is fine. Require this one check rather than
  # the individual jobs.
  ci-ok:
    if: always()
    needs: [rust, deny, upstream, macos]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

[workspace]
resolver = "2"
members = [
    "crates/contextgist-ffi",
]

[workspace.package]
repository = "https://github.com/BelongaGezza/contextGIST"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi     = "0.32"

# GIST's shared crates, pinned to a commit of github.com/BelongaGezza/gist.
# This rev is the single source of truth for what contextGIST builds against;
# `tools/upstream-review.sh --record` moves it (and UPSTREAM_BASELINE) after a
# review. Local GIST checkouts are NOT consulted.
gist-model     = { git = "https://github.com/BelongaGezza/gist", rev = "c6e74f38920dc64964ae8bd1de1790051c232470" }
gist-parse-txt = { git = "https://github.com/BelongaGezza/gist", rev = "c6e74f38920dc64964ae8bd1de1790051c232470" }
gist-rsvp      = { git = "https://github.com/BelongaGezza/gist", rev = "c6e74f38920dc64964ae8bd1de1790051c232470" }

[profile.release]
# Must stay "unwind": contextgist-ffi's `contain` (panic containment at the
# FFI boundary) relies on catch_unwind, which does nothing under
# panic = "abort".
panic = "unwind"

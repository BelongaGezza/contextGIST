[package]
name = "contextgist-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository.workspace = true

[lib]
# staticlib only — apps/macos/project.yml links this in directly as a
# static library (see its OTHER_LDFLAGS comment; no .xcframework here,
# unlike GIST). Do NOT add "cdylib" back: when both a .a and a .dylib of
# the same name exist in the linker's search path, `-lcontextgist_ffi`
# silently prefers the .dylib over the .a. That dylib's install name is
# Cargo's raw absolute build path (not portable), and it's signed
# separately from the app — which passes fine under a Debug build (Xcode
# disables Hardened Runtime for ad-hoc Debug signing) but fails Hardened
# Runtime's library-validation check under Release ("Library not loaded
# ... different Team IDs"), crashing the app on every launch. Caused a
# real outage of the Services menu item on 2026-09-25 — see git history.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Reused as-is from GIST (github.com/BelongaGezza/gist) via a rev-pinned git
# dependency declared in the workspace Cargo.toml — see CLAUDE.md's
# "Relationship to GIST" section. No local fork/copy.
gist-model     = { workspace = true }
gist-parse-txt = { workspace = true }
gist-rsvp      = { workspace = true }
uniffi         = { workspace = true }

[features]
# Pulls in uniffi's clap-based CLI so `uniffi-bindgen` can be built and
# installed as a standalone binary (uniffi 0.28+ no longer ships one on
# crates.io). Not enabled for the library build. Mirrors gist-ffi's Cargo.toml.
uniffi-bindgen-bin = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen-bin"]

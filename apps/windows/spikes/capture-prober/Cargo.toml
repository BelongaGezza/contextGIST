# Throwaway spike (docs/WINDOWS_PLAN.md phase W0.5): measures how often UI
# Automation TextPattern can read another app's selection. Deliberately NOT a
# member of the root workspace (own empty [workspace] table below), so it adds
# nothing to the root Cargo.lock, `--workspace` builds or the macOS/Linux CI.
[package]
name = "capture-prober"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

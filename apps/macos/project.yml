name: contextGIST
options:
  bundleIdPrefix: com.contextgist
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  # tools/gen-bindings.sh builds a host-arch-only staticlib for Debug and a
  # universal (arm64 + x86_64) one for Release, so Debug links only the
  # active arch and Release builds both (ARCHS defaults to arm64 x86_64).
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  contextGIST:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Generated
        type: group
      # Bundled third-party licence notices (Contents/Resources/
      # ThirdPartyNotices.txt), generated by tools/gen-third-party.sh. An
      # explicit resources build phase, as in GIST's apps/apple/project.yml —
      # a plain-text file under a `type: group` source isn't reliably
      # categorised into Copy Bundle Resources otherwise.
      - path: Resources
        buildPhase: resources
      # App icon (Icon Composer format), generated by tools/gen-app-icon.sh
      # from GIST's macOS icon artwork in IconSource/. Not hand-edited. Xcode
      # also derives the flat AppIcon.icns that macOS 13–15 use from it.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contextgist.macos
        PRODUCT_NAME: contextGIST
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: contextGIST.entitlements
        # contextgist-ffi is linked directly as a staticlib (no .xcframework
        # — macOS-only for now, see tools/gen-bindings.sh). Each
        # configuration searches exactly one directory (set under `configs`
        # below), so Debug can't pick up a Release library or vice versa.
        OTHER_LDFLAGS: -lcontextgist_ffi
        # Without an .xcframework (which bundles its own discoverable module
        # map), Swift/Clang need to be told explicitly where
        # contextgist_ffiFFI.modulemap lives — both as a header search path
        # (for `#if canImport(contextgist_ffiFFI)`) and via an explicit
        # -fmodule-map-file so Clang actually loads it as that module.
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/contextgist_ffiFFI.modulemap"
        # Disable Xcode 14+ script sandboxing so the pre-build script can
        # invoke cargo and write into Generated/.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/debug"
        Release:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/universal/release"
    preBuildScripts:
      - name: Generate uniffi bindings
        # Fails the Xcode build if gen-bindings.sh fails. It used to fall back
        # to cached bindings with only a warning, but gen-bindings.sh also
        # builds the contextgist-ffi staticlib, so that fallback silently
        # linked a stale target/<config>/libcontextgist_ffi.a and still
        # reported BUILD SUCCEEDED (hit on 2026-09-30 with a corrupted
        # target/release cache). A missing uniffi-bindgen is not a failure:
        # gen-bindings.sh already exits 0 and keeps existing bindings then.
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! "$SRCROOT/../../tools/gen-bindings.sh"; then
            echo "error: tools/gen-bindings.sh failed (see output above); refusing to link a possibly stale contextgist-ffi. If cargo reports 'mis-aligned LINKEDIT string pool', run 'cargo clean --release' (or plain 'cargo clean' for Debug) and rebuild." >&2
            exit 1
          fi
          if [ -z "$(ls -A "$SRCROOT/Generated" 2>/dev/null)" ]; then
            echo "error: no uniffi bindings in apps/macos/Generated/. Install uniffi-bindgen (see tools/gen-bindings.sh) and rebuild." >&2
            exit 1
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []

  contextGISTTests:
    type: bundle.unit-test
    platform: macOS
    # Pure-logic parity tests (PacingEngine / DisplayToken vs the Rust core).
    # RsvpView.swift and the uniffi bindings are compiled straight into the
    # test bundle (no host app to launch), so the staticlib is linked here too.
    sources:
      - path: Tests
        type: group
        excludes:
          - golden.json
      - path: Tests/golden.json
        buildPhase: resources
      - path: Sources/RsvpView.swift
      - path: Generated
        type: group
    dependencies:
      # Ensures the app target's pre-build script has generated Generated/ and
      # built the staticlib first; not linked or hosted.
      - target: contextGIST
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contextgist.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen would otherwise host the tests in the app (launching it and
        # duplicating RsvpView.swift); these are standalone logic tests.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        OTHER_LDFLAGS: -lcontextgist_ffi
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/contextgist_ffiFFI.modulemap"
      configs:
        Debug:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/debug"
        Release:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/universal/release"

schemes:
  contextGIST:
    build:
      targets:
        contextGIST: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - contextGISTTests

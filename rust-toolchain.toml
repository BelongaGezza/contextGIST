[toolchain]
# Independent of GIST's own rust-toolchain.toml (1.88.0) — that pin is
# for GIST's own CI, and the path-dependency crates it exports have no MSRV
# requirement of their own. contextGIST's uniffi version needs a newer
# rustc than 1.88 to resolve its transitive deps, so this workspace pins
# its own, separately-updated toolchain.
channel = "1.97.1" # matches the "stable" toolchain already installed on this machine
# Release builds are universal (arm64 + x86_64): tools/gen-bindings.sh
# builds both slices and lipo's them together. Listing the targets here
# makes rustup install them automatically.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
